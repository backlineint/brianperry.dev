# Pin pnpm to match the `packageManager` field in package.json so CI doesn't
# fall back to Netlify's default pnpm (which was 10.x). Build command and
# publish directory stay configured in the Netlify UI.
#
# Raise the Node heap so `astro check` doesn't OOM on Netlify's default ~2GB
# limit (especially if a cached `dist/` is present during the check phase).
[build.environment]
  PNPM_VERSION = "11.8.0"
  NODE_OPTIONS = "--max-old-space-size=4096"
